<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Flying Plane</title>
 <style>
 body {
   margin: 0;
   overflow: hidden;
   background: linear-gradient(#87CEEB, #ffffff);
 }

 .sky {
   position: absolute;
   top: 0;
   left: 0;
   width: 100%;
   height: 100%;
   background: linear-gradient(#87CEEB, #ffffff);
 }

 .plane {
   position: absolute;
   top: 50%;
   left: -200px;
   width: 180px;
   height: 60px;
   background-color: #fff;
   border-radius: 30px;
   box-shadow: 0 0 20px rgba(0,0,0,0.3);
   animation: fly 10s linear infinite;
 }

 .plane::before {
   content: '';
   position: absolute;
   top: 10px;
   left: -40px;
   width: 260px;
   height: 20px;
   background-color: #3498db;
   border-radius: 10px;
 }

 .wing {
   position: absolute;
   top: 20px;
   left: 30px;
   width: 120px;
   height: 15px;
   background-color: #e74c3c;
   border-radius: 10px;
 }

 .tail {
   position: absolute;
   top: -20px;
   right: 10px;
   width: 30px;
   height: 40px;
   background-color: #3498db;
   border-radius: 5px;
 }

 @keyframes fly {
   0% { left: -200px; top: 60%; }
   50% { left: 100%; top: 30%; }
   100% { left: -200px; top: 60%; }
 }
 </style>
</head>
<body>
 <div class="sky"></div>
 <div class="plane">
   <div class="wing"></div>
   <div class="tail"></div>
 </div>
</body>
