<button onclick="updateVersion()">Check for Updates</button>



<script>
function updateVersion() {
    // افتح صفحة about وعدل النسخة
    fetch("about/about.html")
      .then(response => response.text())
      .then(data => {
          // غير النص من 1.0 إلى 1.1
          let updated = data.replace("1.0", "1.1");

          // احفظ التغيير في localStorage علشان يظهر للمستخدم
          localStorage.setItem("aboutPage", updated);

          alert("تم التحديث إلى الإصدار 1.1 ✅");
      });
}
</script>
<body>
  <div id="aboutContent"></div>

  <script>
    let saved = localStorage.getItem("aboutPage");
    if (saved) {
        document.getElementById("aboutContent").innerHTML = saved;
    } else {
        document.getElementById("aboutContent").innerHTML = "<p>الإصدار الحالي: 1.1.0</p>";
    }
  </script>
</body>
