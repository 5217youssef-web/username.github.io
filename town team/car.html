 <style>
    
 body{
 margin: 0;
 overflow: hidden;
 background-color: #084858;
 }
 
 .road{
 position: absolute;
 top: 60%;
 width: 100%;
 height: 150px;
 background-color: #333;
 border-top: 5px solid #a89c9c;
 border-bottom: 5px dashed #f8f6f6;

 }

 .car{
 position: absolute;
 top: 55%;
 left: -200px;
 width: 160px;
 height: 70px;
 background-color: #ff0000;
 border-radius: 20px 5px 10px 10px;
 animation: drive 5s linear infinite;


 }

 .car::before{
 content:'';
 position: absolute;
 top: -35px;
 left: 15px;
 width: 100px;
 height: 35px;
 background-color: #0000ff;
 border-radius: 50% 50% 0 0;
 }

 .window{
 position: absolute;
 top: -25px;
 left: 25px;
 width: 40px;
 height: 25px;
 background-color: #0b0b0b;
 border-radius: 10px 0 0 0;
 }

 .wheel{
 position: absolute;
 bottom: -20px;
 width: 40px;
 height: 40px;
 background-color: #000;
 border-radius: 50%;
 border: 5px dashed #939292;
 animation: spin 1s linear infinite;
 }

 .wheel-back{
 left: 20px;
 }
 .wheel-front{
 right: 20px;
 }

 /* مهم جدا */

 @keyframes drive{
 0%{
 left: -50px;
 transform: scaleX(1);
 }
 45%{
 left: 100%;
 transform: scaleX(1);
 }
 50%{
 left: 100%;
 transform: scaleX(-1) translateX(20px);
 }
 95%{
 left: -50px;
 transform: scaleX(-1) translateX(20px);
 }
 100%{
 left: -50px;
 transform: scaleX(1);
 }

 }

 @keyframes spin{

 100%{
 transform: rotate(360deg);
 }
 }
body {
    background-color: rgb(68, 7, 235);
    font-family: Arial, Helvetica, sans-serif;
}

h1 {
    color: #2c3e50;
}

p {
    color: #34495e;
    font-size: 18px;
}


/* نخلي الروابط فوق */
div {
    position: fixed;   /* يخلي العنصر ثابت في مكانه */
    bottom: 0;            /* يثبت عند أعلى الصفحة */
    left: 0;
    width: 100%;       /* يمتد على عرض الصفحة كله */
    background-color: #1ea5f3; /* لون خلفية خفيف */
    padding: 10px;
    text-align: center; /* يخلي الروابط في النص */
}

/* تنسيق الروابط */
div a {
    margin: 0 15px;
    text-decoration: none;
    color: #333;
    font-weight: bold;
}
.wheel {
    position: absolute;
    bottom: -10px;       /* نخليها تحت جسم العربية */
    width: 40px;
    height: 40px;
    background-color: #000;
    border-radius: 50%;
    border: 5px dashed #939292;
    animation: spin 1s linear infinite;
}

.wheel-back {
    left: 30PX;
}

.wheel-front {
    right: 20px;
}























 </style>







</head>
<body>
 <div class="road"></div>

 <div class="car">
 <div class="window"></div>
 <div class="wheel wheel-back"></div>
 <div class="wheel wheel-front"></div>
 </div>
